plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'       // Obligatoire pour Room (génération de code)
}

android {
    namespace 'com.cryptovip.smslistener'
    compileSdk 34

    defaultConfig {
        applicationId "com.cryptovip.smslistener"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // ---- UI de base (AppCompat + Material Design) ----
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ---- Coroutines Kotlin (async / IO propre) ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ---- OkHttp (client HTTP POST vers le serveur) ----
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ---- Room (BDD locale SQLite pour LOGS + file d'attente hors ligne) ----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}
